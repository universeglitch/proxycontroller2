name: Sync Upstream (Protect Wrangler Config)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Merge Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 1. 临时备份你当前包含 CF 变量配置的 wrangler.toml
          cp wrangler.toml wrangler.toml.bak
          
          # 2. 拉取上游代码
          git remote add upstream https://github.com || true
          git fetch upstream
          
          # 3. 强行合并上游更新（如果遇到 wrangler.toml 冲突，优先使用原作者的以保证顺利合并）
          git merge upstream/main --no-edit -X theirs -m "chore: sync with upstream latest release [skip ci]" || true
          
          # 4. 用刚才备份的、属于你自己的 wrangler.toml 强行覆盖回去，确保变量不丢
          mv wrangler.toml.bak wrangler.toml
          
          # 5. 将你的 wrangler.toml 重新加入提交暂存区
          git add wrangler.toml
          
          # 6. 如果由于还原 wrangler.toml 产生了新的变化，将其提交；若无变化则跳过
          git diff-index --quiet HEAD -- || git commit -m "chore: restore my personal wrangler.toml [skip ci]"

      - name: Push Changes
        run: |
          git push origin ${{ github.ref_name }}
