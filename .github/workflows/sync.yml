name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Clone Upstream
        run: |
          git clone \
            --depth 1 \
            --branch main \
            https://github.com/a6216abcd/Free-Residential-IP-Proxy-Controller.git \
            /tmp/upstream

      - name: Sync Upstream Files
        run: |
          rsync -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='wrangler.toml' \
            /tmp/upstream/ \
            ./

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: sync upstream updates"

      - name: Update Remote
        run: |
          git pull --rebase origin main

      - name: Push Changes
        run: |
          git push origin main
